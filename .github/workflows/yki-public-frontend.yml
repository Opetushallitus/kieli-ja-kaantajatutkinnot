name: Reusable frontend workflow

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application name"
        required: true
        type: string
      cypress-base-url:
        description: "Cypress base url"
        required: true
        type: string
env:
  FRONTEND_DIR: ./frontend
  BACKEND_DIR: ./backend
  GITHUB_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  common-frontend:
    if: ${{ contains(github.event.head_commit.message, inputs.app-name) || contains(github.ref, 'snyk-io') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.23.1]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout v6.0.2
      - uses: szenius/set-timezone@d1416e74a9a643cbf6c711905741e73e3a0c26b8 # szenius/set-timezone v1.1
        with:
          timezoneLinux: "Europe/Helsinki"
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache Yarn modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache v5.0.3
        id: yarn-cache
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('frontend/package.json') }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          yarn install --immutable
        if: steps.yarn-cache.outputs.cache-hit != 'true'
      - name: Run Linters
        working-directory: ${{ env.FRONTEND_DIR }}
        run: yarn ${{ inputs.app-name }}:lint
      - name: Format
        working-directory: ${{ env.FRONTEND_DIR }}
        run: yarn ${{ inputs.app-name }}:format
      - name: Run Jest Tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: yarn ${{ inputs.app-name }}:test:jest
      - name: Cache Cypress
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache v5.0.3
        id: cypress-cache
        with:
          path: "~/.cache/Cypress"
          key: ${{ runner.os }}-cypress-cache-${{ hashFiles('frontend/package.json') }}
      - name: Install Cypress
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # cypress-io/github-action v7.4.1
        with:
          working-directory: ${{ env.FRONTEND_DIR }}
          runTests: false
        if: steps.cypress-cache.outputs.cache-hit != 'true'
      - name: Run Cypress Tests
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # cypress-io/github-action v7.4.1
        with:
          working-directory: ${{ env.FRONTEND_DIR }}
          install: false
          start: yarn ${{ inputs.app-name }}:start:ci
          wait-on: ${{ inputs.cypress-base-url }}
          command: yarn ${{ inputs.app-name }}:test:cypress
        timeout-minutes: 10
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ${{ env.FRONTEND_DIR }}/packages/${{ inputs.app-name }}/public/src/tests/cypress/screenshots
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: yarn ${{ inputs.app-name }}:build
      - name: Cache build
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache v5.0.3
        with:
          path: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}/src/main/resources/static/public
          key: ${{ runner.os }}-${{ inputs.app-name }}-public-frontend-build-${{ github.sha }}
