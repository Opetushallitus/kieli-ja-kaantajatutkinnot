name: Reusable backend workflow

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application name"
        required: true
        type: string
      with-wkhtmltopdf:
        description: "Should wkhtmltopdf be installed or not"
        required: false
        type: boolean
        default: false
      yki-separate-frontend-builds:
        description: "Is YKI separate frontend build used"
        required: false
        type: boolean
        default: false

env:
  BACKEND_DIR: ./backend

jobs:
  common-backend:
    if: ${{ contains(github.event.head_commit.message, inputs.app-name) || contains(github.ref, 'snyk-io') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout v6.0.2
      - name: Cache local Maven repository
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache v5.0.3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache/restore v5.0.3
        if: ${{ !inputs.yki-separate-frontend-builds }}
        with:
          path: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}/src/main/resources/static
          key: ${{ runner.os }}-${{ inputs.app-name }}-frontend-build-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache/restore v5.0.3
        if: ${{ inputs.yki-separate-frontend-builds }}
        with:
          path: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}/src/main/resources/static/public
          key: ${{ runner.os }}-${{ inputs.app-name }}-public-frontend-build-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache/restore v5.0.3
        if: ${{ inputs.yki-separate-frontend-builds }}
        with:
          path: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}/src/main/resources/static/v2/clerk
          key: ${{ runner.os }}-${{ inputs.app-name }}-clerk-frontend-build-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # actions/setup-java v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: szenius/set-timezone@d1416e74a9a643cbf6c711905741e73e3a0c26b8 # szenius/set-timezone v1.1
        with:
          timezoneLinux: "Europe/Helsinki"
      - name: Install wkhtmltopdf
        if: inputs.with-wkhtmltopdf
        run: |
          echo 'Updating apt-get package information'
          sudo apt-get update
          echo 'Installing wkhtmltopdf'
          sudo apt-get install wkhtmltopdf
          echo 'Installed wkhtmltopdf, check that it works'
          wkhtmltopdf --version
          echo 'Installation of wkhtmltopdf completed'
        shell: bash
      - name: Prepare maven settings
        uses: s4u/maven-settings-action@6fd54e315175e01fffb0b988c0254feb388869f8 # s4u/maven-settings-action v2
        with:
          servers: '[{"id": "oph-github-packages", "username": "${GITHUB_USERNAME}", "password": "${GITHUB_REGISTRY_TOKEN}"}]'
      - name: Build with Maven
        working-directory: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}
        run: mvn clean install -Dplugin.prettier.goal=check
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_REGISTRY_TOKEN: ${{ github.token }}
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache v5.0.3
        with:
          path: ${{ env.BACKEND_DIR }}/${{ inputs.app-name }}/target/${{ inputs.app-name }}-*.jar
          key: ${{ runner.os }}-${{ inputs.app-name }}-backend-build-${{ github.sha }}
