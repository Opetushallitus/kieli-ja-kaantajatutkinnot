server:
  port: ${application.port:8083}
  compression:
    enabled: true
  servlet:
    context-path: "/yki"
spring:
  datasource:
    url: ${postgresql.url:jdbc:postgresql://localhost:5432/yki}
    username: ${postgresql.username:admin}
    password: ${postgresql.password:admin}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  web:
    resources:
      static-locations: classpath:static/
      cache:
        cachecontrol:
          max-age: 30d
      chain:
        cache: true
  thymeleaf:
    prefix: classpath:static/
    templateResolverOrder: 1
management:
  endpoints:
    access:
      default: none
    web:
      base-path: "/status"
      exposure:
        include: "health,info"
  endpoint:
    info:
      access: read_only
    health:
      access: read_only
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
app:
  koski:
    url: ${koski.url:null}
    user: ${cas.username:null}
    password: ${cas.password:null}
